# GitHub Actions copy of the Drone pipeline in .drone.yml.
# The deployment job is disabled for now; Drone still deploys.
name: CI JTracker

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  composer:
    name: Install PHP dependencies
    runs-on: ubuntu-latest
    container: joomlaprojects/docker-images:php8.1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: cache-php
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
      - name: Install PHP dependencies
        if: steps.cache-php.outputs.cache-hit != 'true'
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          composer install --no-progress --ignore-platform-req=ext-intl

  php-cs-fixer:
    name: Check PHP code style
    runs-on: ubuntu-latest
    container: joomlaprojects/docker-images:php8.1
    needs: [composer]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          fail-on-cache-miss: true
      - name: Check PHP code style (PHP-CS-Fixer)
        run: ./vendor/bin/php-cs-fixer fix -vvv --dry-run --diff

  phpstan:
    name: Run PHPStan
    runs-on: ubuntu-latest
    container: joomlaprojects/docker-images:php8.1
    needs: [composer]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          fail-on-cache-miss: true
      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --error-format=github src tests

  php81:
    name: Run Unit tests (PHP 8.1)
    runs-on: ubuntu-latest
    container: joomlaprojects/docker-images:php8.1
    needs: [php-cs-fixer]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          fail-on-cache-miss: true
      - name: Run Unit tests
        run: |
          php -v
          ./vendor/bin/phpunit --configuration=phpunit.xml

  php82:
    # Same as "failure: ignore" in Drone: failures are reported but don't fail the build
    name: Run Unit tests (PHP 8.2, allowed to fail)
    runs-on: ubuntu-latest
    container: joomlaprojects/docker-images:php8.2
    needs: [php-cs-fixer]
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          fail-on-cache-miss: true
      - name: Run Unit tests
        run: |
          php -v
          ./vendor/bin/phpunit --configuration=phpunit.xml

  deployment:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [php81]
    # Disabled for now: deployment still runs through Drone.
    # To enable, remove "false &&" and add the JISSUES_HOST, JISSUES_USERNAME
    # and JISSUES_KEY repository secrets.
    if: false && github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Run update on server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.JISSUES_HOST }}
          username: ${{ secrets.JISSUES_USERNAME }}
          port: 22
          key: ${{ secrets.JISSUES_KEY }}
          script: bin/jtracker update:server --log=cron.log
